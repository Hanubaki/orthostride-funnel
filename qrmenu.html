<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canlı Dijital QR Menü & Hızlı Sipariş Sistemi</title>
  <style>
    :root { --bg: #0c0a09; --card: #1c1917; --accent: #f97316; --green: #22c55e; --text: #fafaf9; --muted: #a8a29e; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 100px; }
    .demo-bar { background: linear-gradient(90deg, #ea580c, #d97706); color: #fff; padding: 10px 14px; font-size: 13px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 50; }
    .demo-bar a { background: #fff; color: #0c0a09; text-decoration: none; padding: 6px 12px; border-radius: 99px; font-weight: 900; font-size: 12px; white-space: nowrap; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 18px 16px; }
    .hero { background: linear-gradient(145deg, #292524, #1c1917); border: 1px solid rgba(249,115,22,0.3); border-radius: 18px; padding: 20px; text-align: center; margin-bottom: 18px; }
    .badge { display: inline-block; background: rgba(249,115,22,0.18); color: #fb923c; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 99px; margin-bottom: 8px; }
    h1 { font-size: 24px; font-weight: 900; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .qr-box { background: #fff; padding: 10px; border-radius: 12px; display: inline-block; margin-bottom: 8px; }
    .qr-box img { width: 110px; height: 110px; display: block; }
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px; }
    .tab { background: var(--card); color: var(--muted); border: 1px solid rgba(255,255,255,0.1); padding: 8px 14px; border-radius: 99px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .menu-list { display: flex; flex-direction: column; gap: 12px; }
    .item { background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .item-title { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
    .item-desc { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .item-price { font-size: 15px; font-weight: 900; color: #fb923c; }
    .btn-add { background: var(--accent); color: #fff; border: none; font-weight: 900; padding: 9px 14px; border-radius: 10px; cursor: pointer; font-size: 13px; white-space: nowrap; }
    .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #18181b; border-top: 1px solid rgba(255,255,255,0.15); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; max-width: 480px; margin: 0 auto; z-index: 40; }
    .cart-btn { background: var(--green); color: #052e16; text-decoration: none; font-weight: 900; padding: 11px 18px; border-radius: 10px; font-size: 14px; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="demo-bar">
    <span id="demoBarText">🔥 Bu Canlı QR Menü İşletmeniz İçin Hazırlandı (Aylık Ücret Yok: 400 TL)</span>
    <a id="buySystemBtn" href="./odeme.html?paket=QR%20Menu%20Sistemi&fiyat=400%20TL">💳 400 TL Satın Al</a>
  </div>

  <div class="wrap">
    <div class="hero">
      <span class="badge">📲 TEMASSIZ KAREKOD MENÜ &amp; SİPARİŞ</span>
      <h1 id="bizName">Lezzet Durağı Cafe &amp; Bistro</h1>
      <p class="sub">Masadaki karekodu okutun, ürünleri seçip tek tıkla sipariş verin.</p>
      <div class="qr-box">
        <img id="qrImg" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://hanubaki.github.io/orthostride-funnel/qrmenu.html" alt="Masa QR Kodu" />
      </div>
      <div style="font-size:11px;color:#a8a29e;">Masa 1 için Otomatik Üretilen Karekod</div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="filterMenu('all', this)">🔥 Tüm Menü</button>
      <button class="tab" onclick="filterMenu('ana', this)">🍔 Ana Yemek &amp; Burger</button>
      <button class="tab" onclick="filterMenu('tatli', this)">🍰 Tatlı &amp; Kahve</button>
      <button class="tab" onclick="filterMenu('icecek', this)">🥤 Soğuk İçecekler</button>
    </div>

    <div id="menuList" class="menu-list"></div>
  </div>

  <div class="cart-bar">
    <div>
      <div style="font-size:11px;color:#a8a29e;">Sepet Toplamı (<span id="cartCount">0</span> Ürün)</div>
      <div style="font-size:18px;font-weight:900;color:#4ade80;" id="cartTotal">0 TL</div>
    </div>
    <button class="cart-btn" onclick="completeOrder()">📲 Siparişi Tamamla →</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const mekan = params.get("mekan") || params.get("biz") || "Lezzet Durağı Cafe & Bistro";
    document.getElementById("bizName").textContent = mekan;
    document.title = mekan + " — Dijital QR Menü";
    document.getElementById("demoBarText").textContent = "🔥 " + mekan + " QR Menü Demosu (Tek Seferlik 400 TL)";
    document.getElementById("buySystemBtn").href = "./odeme.html?paket=" + encodeURIComponent(mekan + " QR Menu Sistemi (400 TL)");
    document.getElementById("qrImg").src = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + encodeURIComponent(window.location.href);

    const ITEMS = [
      { id: 1, cat: "ana", name: "Özel Şef Burger Menü", desc: "180gr dana köfte, karamelize soğan, cheddar, patates kızartması", price: 290 },
      { id: 2, cat: "ana", name: "Izgara Tavuk Bowl", desc: "Avokado, kinoa, ızgara tavuk dilimleri ve özel Akdeniz sosu", price: 240 },
      { id: 3, cat: "ana", name: "Karışık Tost & Kahvaltı Tabağı", desc: "Kaşar, sucuk, domates, zeytin, patates ve demleme çay", price: 195 },
      { id: 4, cat: "tatli", name: "San Sebastian Cheesecake", desc: "Belçika çikolatası sosu ile günlük taze üretim", price: 175 },
      { id: 5, cat: "tatli", name: "Iced Spanish Latte", desc: "Çift shot %100 Arabica espresso ve yoğunlaştırılmış süt", price: 130 },
      { id: 6, cat: "icecek", name: "Ev Yapımı Taze Naneli Limonata", desc: "Doğal sıkma limon, taze nane yaprakları (400ml)", price: 95 }
    ];

    let cartCount = 0;
    let cartTotal = 0;

    function renderMenu(cat = "all") {
      const list = document.getElementById("menuList");
      list.innerHTML = "";
      ITEMS.filter(x => cat === "all" || x.cat === cat).forEach(item => {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <div>
            <div class="item-title">${item.name}</div>
            <div class="item-desc">${item.desc}</div>
            <div class="item-price">${item.price} TL</div>
          </div>
          <button class="btn-add" onclick="addItem(${item.price})">+ Ekle</button>
        `;
        list.appendChild(div);
      });
    }

    function filterMenu(cat, btn) {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      btn.classList.add("active");
      renderMenu(cat);
    }

    function addItem(price) {
      cartCount++;
      cartTotal += price;
      document.getElementById("cartCount").textContent = cartCount;
      document.getElementById("cartTotal").textContent = cartTotal + " TL";
    }

    function completeOrder() {
      if (cartCount === 0) return alert("Lütfen menüden en az 1 ürün seçin!");
      if (confirm(mekan + " için canlı QR menü testini tamamladınız! Bu sistemi işletmeniz için tek seferlik 400 TL'ye (aylık ücret olmadan) hemen teslim almak ister misiniz?")) {
        window.location.href = "./odeme.html?paket=" + encodeURIComponent(mekan + " QR Menu Sistemi (400 TL)");
      }
    }

    renderMenu();
  </script>
</body>
</html>
